name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci || npm install
      - name: Build (tsc)
        run: npm run build
      - name: Test suite
        run: npm test
      - name: ASCII invariant (INV-001)
        run: |
          ! grep -rPn "[^\x00-\x7F]" src/ bin/ tests/ README.md USER_GUIDE.md
