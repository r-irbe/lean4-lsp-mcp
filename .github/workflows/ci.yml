name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci || npm install
      - name: Scoped Unicode policy (INV-001)
        run: node tools/check-unicode.mjs
      - name: WASM binary size gate (<= 131072 B)
        run: node tools/check-wasm-size.mjs
      - name: Build (tsc)
        run: npm run build
      - name: Test suite
        run: npm test
