name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci || npm install
      - name: Scoped Unicode policy (INV-001)
        run: node tools/check-unicode.mjs
      - name: WASM binary size gate (<= 131072 B)
        run: node tools/check-wasm-size.mjs
      - name: Build (tsc)
        run: npm run build
      - name: Keep graph archives out of npm
        run: |
          npm pack --dry-run --ignore-scripts --json > "$RUNNER_TEMP/npm-pack.json"
          node -e 'const [{files}] = require(process.argv[1]); if (files.some(({path}) => /\.(kz|kuzu)(\.xz)?$/.test(path))) throw new Error("Graph archive in npm package")' "$RUNNER_TEMP/npm-pack.json"
      - name: Test suite
        run: npm test
