id: rule-lean-no-redundant-suffices-target-dup
language: Lean
severity: warning
message: "Redundant suffices target tactic detected: consecutive duplicate suffices invocations targeting identical proposition expressions"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive suffices calls targeting
  identical proposition terms create redundant intermediate proof goals, goal stack pollution,
  and bloated proof AST traces. Formulate the intermediate assertion once or use have.
rule:
  regex: "(?m)^\\s*suffices\\s+([a-zA-Z0-9_. :]+)\\s*by\\s*$\\n\\s*suffices\\s+\\1\\s*by\\s*$"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
