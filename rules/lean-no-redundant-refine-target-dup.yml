id: rule-lean-no-redundant-refine-target-dup
language: Lean
severity: warning
message: "Redundant refine target tactic detected: consecutive duplicate refine invocations targeting identical term patterns"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive refine calls targeting
  identical term expressions create redundant unification goals, elaborator stalls,
  and bloated proof AST traces. Combine them into a single structured refine or exact call.
rule:
  regex: "(?m)^\\s*refine\\s+([a-zA-Z0-9_.? ]+)\\s*$\\n\\s*refine\\s+\\1\\s*$"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
