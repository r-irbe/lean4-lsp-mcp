id: rule-lean-no-redundant-apply-dup
language: Lean
severity: warning
message: "Redundant apply tactic detected: consecutive duplicate apply calls"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive apply calls without intermediate
  goal modification introduce redundant unification passes, backtrack overhead, and slow elaborator
  traversals. Eliminate the duplicate apply or structure the proof with an explicit lemma application.
rule:
  regex: "(?m)^\\s*apply\\b.*\\n\\s*apply\\b"
fix: ""
metadata:
  category: performance
  weight: 75
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
