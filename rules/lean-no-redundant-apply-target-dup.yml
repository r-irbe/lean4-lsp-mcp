id: rule-lean-no-redundant-apply-target-dup
language: Lean
severity: warning
message: "Redundant apply target tactic detected: consecutive duplicate apply invocations targeting identical expressions"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive apply calls targeting
  identical expressions create redundant unification search attempts, backtracking
  overhead, and bloated proof AST traces. Use a single apply invocation or chained refinement.
rule:
  regex: '(?m)^\s*apply\s+(.+)$\n\s*apply\s+\1$'
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
