id: rule-lean-no-redundant-congr-dup
language: Lean
severity: warning
message: "Redundant congr target tactic detected: consecutive duplicate congr invocations targeting identical goal types"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive congr calls targeting
  identical expressions create redundant churn and bloated proof AST traces.
  State the intended form once, or advance intermediate sub-goals directly.
rule:
  regex: "(?m)^\\s*congr\\s+([a-zA-Z0-9_. :]+)\\s*$\\n\\s*congr\\s+\\1\\s*$"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
