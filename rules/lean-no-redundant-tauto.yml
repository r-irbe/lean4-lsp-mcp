id: rule-lean-no-redundant-tauto
language: Lean
severity: warning
message: "Redundant tauto tactic detected: consecutive tauto calls"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive tauto calls create redundant
  propositional tautology searches and clutter proof scripts. If tauto fails or succeeds,
  repeating tauto consecutively without intermediate transformations is redundant.
rule:
  regex: "(?m)^\\s*tauto\\b.*\\n\\s*tauto\\b"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
