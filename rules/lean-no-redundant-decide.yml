id: rule-lean-no-redundant-decide
language: Lean
severity: warning
message: "Redundant decide tactic detected: consecutive decide calls"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive decide calls create redundant
  computational reflection evaluations and clutter proof scripts. If decide fails or succeeds,
  repeating decide consecutively without intermediate transformations is redundant.
rule:
  regex: "(?m)^\\s*decide\\b.*\\n\\s*decide\\b"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
