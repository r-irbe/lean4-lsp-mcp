id: rule-lean-no-redundant-intro-target-dup
language: Lean
severity: warning
message: "Redundant intro target tactic detected: consecutive duplicate intro invocations targeting identical variable names"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive intro calls targeting
  identical variable names create shadowing, naming collisions, elaborator warnings,
  and bloated proof AST traces. Use a multi-variable intro invocation `intro x y` or unique identifiers.
rule:
  regex: "(?m)^\\s*intro\\s+([a-zA-Z0-9_]+)$\\n\\s*intro\\s+\\1$"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
