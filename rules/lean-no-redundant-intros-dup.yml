id: rule-lean-no-redundant-intros-dup
language: Lean
severity: warning
message: "Redundant intros tactic detected: consecutive duplicate intros calls"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive intros calls without intermediate
  goal modification introduce redundant binder introduction cycles, variable scope churn, and slow elaborator
  traversals. Combine variable introductions into a single intros [...] call or eliminate the redundant step.
rule:
  regex: "(?m)^\\s*intros\\b.*\\n\\s*intros\\b"
fix: ""
metadata:
  category: performance
  weight: 75
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
