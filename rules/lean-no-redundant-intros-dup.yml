id: rule-lean-no-redundant-intros-dup
language: Lean
severity: warning
message: "Redundant intros tactic detected: consecutive duplicate intros invocations without intervening goal modifications"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive intros calls
  create redundant elaborator passes. Bind introduced variables in a single intros invocation.
rule:
  regex: "(?m)^\\s*intros\\s*$\\n\\s*intros\\s*$"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
