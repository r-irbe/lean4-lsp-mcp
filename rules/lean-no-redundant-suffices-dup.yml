id: rule-lean-no-redundant-suffices-dup
language: Lean
severity: warning
message: "Redundant suffices tactic detected: consecutive duplicate suffices invocations"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive suffices calls create
  redundant backward proof obligations, context duplication overhead, and bloated proof AST traces.
  State the required intermediate implication once or chain obligations via have/show.
rule:
  regex: "(?m)^\\s*suffices\\b.*\\n\\s*suffices\\b"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
