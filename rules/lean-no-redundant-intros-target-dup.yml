id: rule-lean-no-redundant-intros-target-dup
language: Lean
severity: warning
message: "Redundant intros target tactic detected: consecutive duplicate intros invocations targeting identical variable names"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive intros calls targeting
  identical variable names create shadowing, naming collisions, elaborator warnings,
  and bloated proof AST traces. Combine them into a single multi-variable intros invocation or use unique identifiers.
rule:
  regex: "(?m)^\\s*intros\\s+([a-zA-Z0-9_]+)$\\n\\s*intros\\s+\\1$"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
