id: rule-lean-no-redundant-rcases-target-dup
language: Lean
severity: warning
message: "Redundant rcases target tactic detected: consecutive duplicate rcases invocations on identical term or pattern"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive rcases calls targeting the identical
  term or binder pattern introduce redundant recursive destructuring passes, hypothesis context
  churn, and bloated proof AST traces. Destructure the recursive cases once and reuse
  the resulting decomposed hypotheses in subsequent tactic blocks.
rule:
  regex: "(?m)^\\s*rcases\\s+([^:\\n]+)\\s+with.*$\\n\\s*rcases\\s+\\1\\s+with"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
