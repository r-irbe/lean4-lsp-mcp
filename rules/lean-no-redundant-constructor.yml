id: rule-lean-no-redundant-constructor
language: Lean
severity: warning
message: "Redundant constructor tactic detected: consecutive duplicate constructor calls"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive constructor calls create dead
  elaboration cycles and unconstrained subgoals. Applying constructor immediately after
  another constructor without resolving the generated subgoals indicates malformed or
  redundant tactic scripting that bloats proof traces.
rule:
  regex: "(?m)^\\s*constructor\\b.*\\n\\s*constructor\\b"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
