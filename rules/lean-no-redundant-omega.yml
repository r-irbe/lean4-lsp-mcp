id: rule-lean-no-redundant-omega
language: Lean
severity: warning
message: "Redundant omega tactic detected: consecutive omega calls"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive omega calls create dead Presburger
  decision cycles. If omega discharges or normalizes the linear integer arithmetic state,
  repeating omega consecutively without hypothesis modifications is completely redundant.
rule:
  regex: "(?m)^\\s*omega\\b.*\\n\\s*omega\\b"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
