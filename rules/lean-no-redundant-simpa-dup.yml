id: rule-lean-no-redundant-simpa-dup
language: Lean
severity: warning
message: "Redundant simpa tactic detected: consecutive duplicate simpa invocations on identical goals"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive simpa calls
  create redundant computation churn. Ensure intermediate progress is checked.
rule:
  regex: '(?m)^\s*simpa\s*$\n\s*simpa\s*$'
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
