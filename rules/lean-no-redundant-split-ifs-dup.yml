id: rule-lean-no-redundant-split-ifs-dup
language: Lean
severity: warning
message: "Redundant split_ifs tactic detected: consecutive duplicate split_ifs invocations without intervening branching resolution"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive split_ifs calls
  create redundant sub-goal elaboration churn. Resolve branches or apply targeted if-reduction.
rule:
  regex: "(?m)^\\s*split_ifs\\s*$\\n\\s*split_ifs\\s*$"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
