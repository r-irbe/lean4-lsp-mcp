id: rule-lean-no-unbounded-reynolds-stress
language: Lean
severity: warning
message: "Unanchored Reynolds stress or turbulent cascade production detected: bare cascade scaling without dissipation bound"
note: |
  Turbulent energy cascade dynamics and Reynolds stress closure bounds require explicit dissipation
  rates and energy flux conservation constraints. Unconstrained turbulent production without
  anchoring hypotheses risks unphysical variance explosion in multi-agent belief fields.
  Anchor Reynolds stress and cascade invariants using cascadeSafetyMargin or turbulentAdvantageMargin
  as formalized in NavierStokesAndEuler (Template_ReynoldsCascade).
rule:
  regex: "(?m)^\\s*dsimp\\s*\\[.*(?:cascadeSafetyMargin|turbulentAdvantageMargin|reynoldsStressBound).*\\].*\\n\\s*linarith\\b"
fix: ""
metadata:
  category: correctness
  weight: 75
tags:
  - lean
  - reynolds-stress
  - turbulent-cascade
  - energy-flux
  - ast-guard
