id: rule-lean-no-redundant-simp-only-dup
language: Lean
severity: warning
message: "Redundant simp only tactic detected: consecutive duplicate simp only calls"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive simp only calls without intermediate
  goal modification introduce redundant simplifier engine passes, cache invalidation, and slow elaborator
  traversals. Combine lemmas into a single simp only [...] call or eliminate the redundant step.
rule:
  regex: "(?m)^\\s*simp only\\b.*\\n\\s*simp only\\b"
fix: ""
metadata:
  category: performance
  weight: 75
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
