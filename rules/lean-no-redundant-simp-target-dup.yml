id: rule-lean-no-redundant-simp-target-dup
language: Lean
severity: warning
message: "Redundant simp target tactic detected: consecutive duplicate simp only invocations targeting identical expression sets"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive simp only calls targeting
  identical expression lists create redundant term simplification traversals, unneeded unification passes,
  and bloated proof AST traces. Consolidate them or remove redundant simplify steps.
rule:
  regex: "(?m)^\\s*simp\\s+only\\s+\\[(.+)\\]$\\n\\s*simp\\s+only\\s+\\[\\1\\]$"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
