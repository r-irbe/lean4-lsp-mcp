id: rule-lean-no-redundant-rfl-dup
language: Lean
severity: warning
message: "Redundant rfl tactic detected: consecutive duplicate rfl invocations"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive rfl calls create dead reflexivity
  reduction cycles, elaborator churn, and bloated proof AST traces.
  Remove superfluous duplicate rfl invocations or advance the proof goal.
rule:
  regex: "(?m)^\\s*rfl\\b.*\\n\\s*rfl\\b"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
