id: rule-lean-tier-backward-dependency-guard
language: Lean
severity: error
message: "Illegal backward dependency: lower architectural tier imports from higher tier in 4-tier DAG"
note: |
  The subpackage architecture under `packages/` enforces a strict 4-tier DAG:
    - Tier 0: tacit-foundations (Foundations)
    - Tier 1: stochastic-ccv (StochasticCCV, TensorNetwork), cusp-catastrophe (CuspCatastrophe), phase-portrait (PhasePortrait)
    - Tier 2: reinforcement-learning (ReinforcementLearning)
    - Tier 3: agentic-safety (AgenticSafety), provenance-chain (ProvenanceChain)
  Backward dependencies (lower tier importing from higher tier) violate topological sorting:
    1. Tier 0 files MUST NOT import from Tier 1, Tier 2, or Tier 3.
    2. Tier 1 files MUST NOT import from Tier 2 or Tier 3.
    3. Tier 2 files MUST NOT import from Tier 3.
rule:
  any:
    # 1. Tier 0 files importing Tier 1, Tier 2, or Tier 3
    - all:
        - regex: "(?m)^\\s*(?:--\\s*(?:\\[?(?:tier|Tier)\\s*0\\]?|module\\s+Foundations|package\\s+tacit[-_]foundations)|namespace\\s+Foundations(?:\\.[A-Za-z0-9_]+)*\\b)"
        - regex: "(?m)^\\s*import\\s+(?:[A-Za-z0-9_.]+\\s+)*(?:StochasticCCV|TensorNetwork|CuspCatastrophe|PhasePortrait|ReinforcementLearning|AgenticSafety|ProvenanceChain)(?:\\.[A-Za-z0-9_]+)*\\b"
    # 2. Tier 1 files importing Tier 2 or Tier 3
    - all:
        - regex: "(?m)^\\s*(?:--\\s*(?:\\[?(?:tier|Tier)\\s*1\\]?|module\\s+(?:StochasticCCV|TensorNetwork|CuspCatastrophe|PhasePortrait)|package\\s+(?:stochastic[-_]ccv|cusp[-_]catastrophe|phase[-_]portrait))|namespace\\s+(?:StochasticCCV|TensorNetwork|CuspCatastrophe|PhasePortrait)(?:\\.[A-Za-z0-9_]+)*\\b)"
        - regex: "(?m)^\\s*import\\s+(?:[A-Za-z0-9_.]+\\s+)*(?:ReinforcementLearning|AgenticSafety|ProvenanceChain)(?:\\.[A-Za-z0-9_]+)*\\b"
    # 3. Tier 2 files importing Tier 3
    - all:
        - regex: "(?m)^\\s*(?:--\\s*(?:\\[?(?:tier|Tier)\\s*2\\]?|module\\s+ReinforcementLearning|package\\s+reinforcement[-_]learning)|namespace\\s+ReinforcementLearning(?:\\.[A-Za-z0-9_]+)*\\b)"
        - regex: "(?m)^\\s*import\\s+(?:[A-Za-z0-9_.]+\\s+)*(?:AgenticSafety|ProvenanceChain)(?:\\.[A-Za-z0-9_]+)*\\b"
fix: ""
metadata:
  category: correctness
  weight: 100
tags:
  - lean
  - dag-invariants
  - architecture
  - tier-integrity
  - backward-dependency
