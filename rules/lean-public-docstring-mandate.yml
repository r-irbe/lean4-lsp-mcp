id: rule-lean-public-docstring-mandate
language: Lean
severity: info
scope: any
message: "Public theorem, definition, or lemma missing '/-- ... -/' docstring"
note: |
  Public mathematical declarations (def, theorem, lemma) should be documented
  with a preceding '/-- ... -/' docstring explaining mathematical intent and hypotheses.
  Private declarations (private def, private theorem) are exempt from this mandate.
  Opt in via `--min-severity info`.
rule:
  regex: "(?<!/--(?:(?!--/|-/)[\\s\\S])*?-/(?:[ \\t\\r\\n]|@\\[[^\\]]*\\])*)^[ \\t]*(?!(?:(?:noncomputable|protected|scoped|unsafe|partial)\\s+)*private\\b)(?:(?:noncomputable|protected|scoped|unsafe|partial)\\s+)*(?:def|theorem|lemma)\\s+[A-Za-z0-9_.']+\\b"
fix: ""
metadata:
  category: maintainability
  weight: 70
tags:
  - lean
  - documentation
  - quality-gates
