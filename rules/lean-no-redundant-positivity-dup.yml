id: rule-lean-no-redundant-positivity-dup
language: Lean
severity: warning
message: "Redundant positivity tactic detected: consecutive duplicate positivity invocations on identical goals"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive positivity calls
  create redundant computation churn. Ensure intermediate progress is checked.
rule:
  regex: '(?m)^\s*positivity\s*$\n\s*positivity\s*$'
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
