id: rule-lean-no-redundant-rw-dup
language: Lean
severity: warning
message: "Redundant rw tactic detected: consecutive duplicate rw invocations"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive rw calls on identical rewrite
  lemmas create dead equational substitution cycles, elaborator context churn, and bloated proof traces.
  Combine rewrite rules or advance the proof goal with intermediate structural steps.
rule:
  regex: "(?m)^\\s*rw\\s*(\\[[^\\]]*\\])?\\s*\\n\\s*rw\\s*\\1\\b"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
