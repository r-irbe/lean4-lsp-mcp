id: rule-lean-no-redundant-simp-args
language: Lean
severity: warning
message: "Redundant simp arguments detected: duplicate argument in simp bracket list"
note: |
  Lean 4 tactic scripts that supply duplicate theorem or lemma arguments inside a simp
  bracket list (e.g. `simp only [h, h]` or `simp [foo, bar, foo]`) trigger redundant simplifier
  index lookups, duplicate congruence rewriting passes, and inflated AST proof payloads.
  Eliminate duplicate tokens within the simp argument bracket list.
rule:
  regex: "(?m)\\bsimp\\s*(?:only)?\\s*\\[[^\\]]*\\b([a-zA-Z0-9_.]+)\\b[^\\]]*\\b\\1\\b[^\\]]*\\]"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
