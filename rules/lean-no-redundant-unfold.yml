id: rule-lean-no-redundant-unfold
language: Lean
severity: warning
message: "Redundant unfold tactic detected: consecutive duplicate unfold calls"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive unfold calls on identical
  declarations introduce redundant definitional unfolding passes, elaborator context churn,
  and bloated proof AST payloads. Combine multiple definitions into a single unfold call
  or rely on dsimp / rfl.
rule:
  regex: "(?m)^\\s*unfold\\s+([a-zA-Z0-9_.]+)\\s*\\n\\s*unfold\\s+\\1\\b"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
