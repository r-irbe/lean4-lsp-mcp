id: rule-lean-no-unbounded-logarithmic-gradient
language: Lean
severity: warning
message: "Unanchored logarithmic gradient estimate detected: bare
  gradient scaling without Sobolev base bound"
note: |
  Logarithmic gradient estimates and Beale-Kato-Majda criteria require
  explicit Sobolev embedding constants and baseline enstrophy bounds.
  Unconstrained gradient amplification without anchoring hypotheses risks
  uncontrolled growth in multi-agent belief sensitivity. Anchor gradient
  bounds using isGradientSafe or gradientSafetyMargin invariants as
  formalized in NavierStokesAndEuler (Template_LogarithmicGradient).
rule:
  regex: "(?m)^\\s*dsimp\\s*\\[.*(?:gradientSafetyMargin|\
  estimatedGradientBound|sobolev_factor).*\\].*\\n\\s*linarith\\b"
fix: ""
metadata:
  category: correctness
  weight: 75
tags:
  - lean
  - logarithmic-gradient
  - beale-kato-majda
  - sobolev-estimate
  - ast-guard
