id: rule-lean-no-redundant-congr-target-dup
language: Lean
severity: warning
message: "Redundant congr target tactic detected: consecutive duplicate congr invocations targeting identical term or depth"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive congr calls targeting the identical
  term or application depth introduce redundant congruence passes, goal tree fragmentation,
  and bloated proof AST traces. Apply congruence once and proceed with leaf subgoals.
rule:
  regex: "(?m)^\\s*congr\\s*$\\n\\s*congr\\s*$"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
