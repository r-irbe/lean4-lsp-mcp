id: rule-lean-no-redundant-dsimp
language: Lean
severity: warning
message: "Redundant dsimp tactic detected: consecutive dsimp calls"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive dsimp calls create dead definitional
  simplifier cycles and bloat elaboration traces. If dsimp discharges or definitionally simplifies
  the expressions in the state, repeating dsimp consecutively without state transformation is
  redundant and risks looping.
rule:
  regex: "(?m)^\\s*dsimp\\b.*\\n\\s*dsimp\\b"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
