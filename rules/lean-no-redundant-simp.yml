id: rule-lean-no-redundant-simp
language: Lean
severity: warning
message: "Redundant simp tactic detected: consecutive simp calls"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive simp calls create dead simplifier
  cycles and bloat elaboration traces. If simp discharges or simplifies the expressions in the state,
  repeating simp consecutively without state transformation is redundant and risks looping.
rule:
  regex: "(?m)^\\s*simp\\b.*\\n\\s*simp\\b"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
