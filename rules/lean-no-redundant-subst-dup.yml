id: rule-lean-no-redundant-subst-dup
language: Lean
severity: warning
message: "Redundant subst tactic detected: consecutive duplicate subst invocations"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive subst calls create
  redundant equality substitution churn, variable rebinding overhead, and fragile goal states.
  Combine substitutions or advance intermediate sub-goals directly.
rule:
  regex: "(?m)^\\s*subst\\b.*\\n\\s*subst\\b"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
