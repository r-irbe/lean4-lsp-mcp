id: rule-lean-no-redundant-have-dup
language: Lean
severity: warning
message: "Redundant have tactic detected: consecutive duplicate have assertions on identical variable names"
note: |
  Lean 4 tactic scripts that introduce duplicate consecutive have assertions on identical
  variable names without consuming prior hypotheses create shadowed context entries, dead elaboration
  cycles, and bloated proof AST traces. Use distinct hypothesis names or combine assertions.
rule:
  regex: "(?m)^\\s*have\\s+([a-zA-Z0-9_]+)\\s*:[^\\n]+:=\\s*[^\\n]+\\n\\s*have\\s+\\1\\s*:"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
