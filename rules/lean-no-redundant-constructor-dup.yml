id: rule-lean-no-redundant-constructor-dup
language: Lean
severity: warning
message: "Redundant constructor tactic detected: consecutive duplicate constructor calls"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive constructor calls create dead
  elaboration cycles, unconstrained subgoals, and runaway proof trace bloat. Apply constructor
  only when progressing into targeted inductive constructors or combine with constructor matching.
rule:
  regex: "(?m)^\\s*constructor\\b.*\\n\\s*constructor\\b"
fix: ""
metadata:
  category: performance
  weight: 75
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
