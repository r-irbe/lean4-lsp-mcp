id: rule-lean-no-redundant-positivity
language: Lean
severity: warning
message: "Redundant positivity tactic detected: consecutive positivity calls"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive positivity calls create dead tactic cycles
  and redundant positivity normalizer passes. If positivity succeeds, subsequent positivity calls are no-ops;
  if positivity fails, repeating it without modifying hypotheses will also fail.
rule:
  regex: "(?m)^\\s*positivity\\b.*\\n\\s*positivity\\b"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
