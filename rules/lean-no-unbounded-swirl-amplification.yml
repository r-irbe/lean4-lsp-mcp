id: rule-lean-no-unbounded-swirl-amplification
language: Lean
severity: warning
message: "Unanchored axisymmetric swirl amplification detected: bare swirl velocity scaling without critical bifurcation bound"
note: |
  Swirl dynamics and angular momentum concentration in cylindrical coordinates require explicit
  critical bifurcation threshold bounds or circulation safety margins. Unconstrained swirl
  growth without bounding hypotheses risks uncontrolled centrifugal bifurcation into bimodal
  polarization.
  Anchor swirl evolutions using isSwirlSafe or circulationSafetyMargin invariants as formalized
  in NavierStokesAndEuler (Template_AxisymmetricSwirl).
rule:
  regex: "(?m)^\\s*dsimp\\s*\\[.*(?:swirlSafetyMargin|centrifugalIntensity|swirl_sq).*\\].*\\n\\s*linarith\\b"
fix: ""
metadata:
  category: correctness
  weight: 75
tags:
  - lean
  - axisymmetric-flow
  - swirl-dynamics
  - centrifugal-bifurcation
  - ast-guard
