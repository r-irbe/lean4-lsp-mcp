id: rule-lean-no-redundant-exact
language: Lean
severity: warning
message: "Redundant exact tactic detected: consecutive duplicate exact calls"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive exact calls on identical
  terms or hypotheses introduce redundant proof terms, dead elaboration cycles,
  and cluttered proof scripts. Ensure each proof goal is closed with a single exact invocation.
rule:
  regex: "(?m)^\\s*exact\\s+([a-zA-Z0-9_.]+)\\s*\\n\\s*exact\\s+\\1\\b"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
