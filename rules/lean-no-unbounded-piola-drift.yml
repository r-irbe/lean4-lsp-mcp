id: rule-lean-no-unbounded-piola-drift
language: Lean
severity: warning
message: "Unanchored Piola coordinate deformation detected: bare
  coordinate scaling without Jacobian boundedness"
note: |
  Coordinate deformation and Piola transforms require explicit volume
  preservation or Jacobian determinant non-degeneracy anchoring.
  Unconstrained coordinate rescaling without bounding hypotheses risks
  unbounded trajectory drift in belief-space projections. Anchor
  coordinate deformations using volumeRatio or isVolumePreserving
  invariants as formalized in NavierStokesAndEuler
  (Template_PiolaTransform).
rule:
  regex: '^\s*dsimp\s*\[.*(?:aspectRatio|volumeFactor).*\] .*\n\s*linarith\b'

fix: ""
metadata:
  category: correctness
  weight: 75
tags:
  - lean
  - coordinate-deformation
  - piola-transform
  - volume-preservation
  - ast-guard
