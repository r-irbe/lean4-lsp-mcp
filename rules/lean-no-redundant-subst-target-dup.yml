id: rule-lean-no-redundant-subst-target-dup
language: Lean
severity: warning
message: "Redundant subst target tactic detected: consecutive duplicate subst invocations targeting identical variable hypotheses"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive subst calls targeting
  identical variable hypotheses create redundant variable elimination passes, unnecessary context
  rebuilding, and bloated proof AST traces. Variable substitution eliminates the target variable;
  a duplicate call is either a no-op or causes an elaborator failure.
rule:
  regex: "(?m)^\\s*subst\\s+(\\w+)(?:\\s+\\1)+$"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
