id: rule-lean-no-redundant-subst-target-dup
language: Lean
severity: warning
message: "Redundant subst target tactic detected: consecutive duplicate subst invocations targeting identical goal types"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive subst calls targeting
  identical expressions create redundant churn and bloated proof AST traces.
  State the intended form once, or advance intermediate sub-goals directly.
rule:
  regex: "(?m)^\\s*subst\\s+([a-zA-Z0-9_. :]+)\\s*$\\n\\s*subst\\s+\\1\\s*$"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
