id: rule-lean-no-redundant-gcongr-dup
language: Lean
severity: warning
message: "Redundant gcongr tactic detected: consecutive duplicate gcongr invocations on identical goals"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive gcongr calls
  create redundant computation churn. Ensure intermediate progress is checked.
rule:
  regex: '(?m)^\s*gcongr\s*$\n\s*gcongr\s*$'
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
