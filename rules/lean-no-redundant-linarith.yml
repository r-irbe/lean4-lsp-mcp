id: rule-lean-no-redundant-linarith
language: Lean
severity: warning
message: "Redundant linarith tactic detected: consecutive linarith calls"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive linarith calls create dead tactic cycles
  and redundant Fourier-Motzkin linear arithmetic normalizer passes. If linarith succeeds, subsequent linarith calls are no-ops;
  if linarith fails, repeating it without modifying hypotheses will also fail.
rule:
  regex: "(?m)^\\s*linarith\\b.*\\n\\s*linarith\\b"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
