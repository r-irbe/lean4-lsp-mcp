id: rule-lean-no-redundant-open
language: Lean
severity: warning
message: "Redundant open namespace detected: consecutive identical open declarations"
note: |
  Lean 4 modules that introduce duplicate consecutive open declarations for the same namespace
  create redundant scope pollution and non-deterministic symbol shadowing in the elaborator.
  Consolidate open directives or scope them to targeted sections.
rule:
  regex: "(?m)^\\s*open\\s+([A-Za-z0-9_.]+)\\s*\\n\\s*open\\s+\\1\\s*$"
fix: ""
metadata:
  category: style
  weight: 60
tags:
  - lean
  - namespace-hygiene
  - ast-guard
