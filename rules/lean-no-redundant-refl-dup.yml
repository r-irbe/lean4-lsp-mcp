id: rule-lean-no-redundant-refl-dup
language: Lean
severity: warning
message: "Redundant refl tactic detected: consecutive duplicate refl invocations on identical goals"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive refl calls
  create redundant computation churn. Ensure intermediate progress is checked.
rule:
  regex: "(?m)^\s*refl\s*$\n\s*refl\s*$"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
