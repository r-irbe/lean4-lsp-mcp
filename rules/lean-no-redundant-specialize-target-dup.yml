id: rule-lean-no-redundant-specialize-target-dup
language: Lean
severity: warning
message: "Redundant specialize target tactic detected: consecutive duplicate specialize invocations targeting identical hypothesis identifiers"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive specialize calls targeting
  identical hypothesis expressions create redundant specialization churn and bloated proof AST traces.
  Specialize the hypothesis with all needed arguments in a single step, or advance intermediate goals directly.
rule:
  regex: "(?m)^\\s*specialize\\s+([a-zA-Z0-9_. :]+)\\s*$\\n\\s*specialize\\s+\\1\\s*$"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
