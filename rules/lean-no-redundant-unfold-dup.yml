id: rule-lean-no-redundant-unfold-dup
language: Lean
severity: warning
message: "Redundant unfold tactic detected: consecutive duplicate unfold calls"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive unfold calls without intermediate
  goal modification introduce redundant definition unfolding passes, cache invalidation, and
  bloated proof trees. Combine unfolded definitions into a single unfold invocation or use dsimp.
rule:
  regex: "(?m)^\s*unfold\b.*\n\s*unfold\b"
fix: ""
metadata:
  category: performance
  weight: 75
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
