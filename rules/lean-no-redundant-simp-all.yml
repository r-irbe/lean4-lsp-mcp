id: rule-lean-no-redundant-simp-all
language: Lean
severity: warning
message: "Redundant simp_all tactic detected: consecutive simp_all calls"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive simp_all calls create runaway
  elaborator loops and unconstrained context simplification. Consolidate simp arguments or
  use targeted rewrites instead of repeating broad context-wide simplification.
rule:
  regex: "(?m)^\\s*simp_all\\b.*\\n\\s*simp_all\\b"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
