id: rule-lean-no-redundant-clear-dup
language: Lean
severity: warning
message: "Redundant clear target tactic detected: consecutive duplicate clear invocations targeting identical hypotheses"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive clear calls targeting
  identical hypotheses create redundant AST churn. Clear hypotheses in a single invocation.
rule:
  regex: "(?m)^\\s*clear\\s+([a-zA-Z0-9_. :]+)\\s*$\\n\\s*clear\\s+\\1\\s*$"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
