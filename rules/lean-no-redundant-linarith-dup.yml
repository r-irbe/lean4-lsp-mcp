id: rule-lean-no-redundant-linarith-dup
language: Lean
severity: warning
message: "Redundant linarith tactic detected: consecutive duplicate linarith invocations on identical goals"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive linarith calls
  create redundant computation churn. Ensure intermediate progress is checked.
rule:
  regex: '(?m)^\s*linarith\s*$\n\s*linarith\s*$'
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
