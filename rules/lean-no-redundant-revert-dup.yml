id: rule-lean-no-redundant-revert-dup
language: Lean
severity: warning
message: "Redundant revert target tactic detected: consecutive duplicate revert invocations targeting identical hypotheses"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive revert calls targeting
  identical expressions create redundant churn and bloated proof AST traces.
  Revert hypotheses once, or operate directly on the goal.
rule:
  regex: "(?m)^\\s*revert\\s+([a-zA-Z0-9_. :]+)\\s*$\\n\\s*revert\\s+\\1\\s*$"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
