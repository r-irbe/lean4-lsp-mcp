id: rule-lean-no-redundant-cases
language: Lean
severity: warning
message: "Redundant cases tactic detected: consecutive duplicate cases calls"
note: |
  Lean 4 tactic scripts that execute duplicate consecutive cases calls without handling
  the generated subgoals introduce dead elaboration cycles, messy goal state duplication,
  and unconstrained proof traces. Structure case splits cleanly using structured delimiters
  or combinators.
rule:
  regex: "(?m)^\\s*cases\\b.*\\n\\s*cases\\b"
fix: ""
metadata:
  category: performance
  weight: 70
tags:
  - lean
  - elaborator-hygiene
  - ast-guard
